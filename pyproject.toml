[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "linkdogger"
description = "Public-profile people discovery and networking intelligence tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "typer>=0.15.2",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]
linkedin = [
    # NOTE: open-linkedin-api pins `lxml<6.0.0`, which has no Python 3.14
    # wheels yet. On 3.14 install with `--no-deps` and rely on lxml>=6 +
    # beautifulsoup4 (see README).
    "open-linkedin-api>=2.3.1",
]

[project.scripts]
linkdogger = "linkdogger.cli:app"

[project.urls]
Repository = "https://github.com/AbhiDevkota/LinkDogger"

[tool.hatch.version]
path = "src/linkdogger/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["open_linkedin_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
